[project]
name = "auto-content-scraper"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "requests>=2.31.0",
]
[project.scripts]
scraper = "scraper.main:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
[tool.uv.build-backend]
module-root = ""
module-name = "scraper"

[dependency-groups]
dev = [
    "nuitka>=4.2.2",
]
